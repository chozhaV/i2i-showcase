<div class="card group hover:border-primary-500/50 animate-on-scroll transition-transform duration-300 hover:scale-105">
  <div class="relative overflow-hidden rounded-lg mb-4">
    <img
      [src]="product.image"
      [alt]="product.name"
      class="w-full h-48 object-cover"
      loading="lazy"
    />
    
  </div>

  <div class="space-y-3">
    <h3
      class="text-xl font-semibold text-white group-hover:text-primary-400 transition-colors duration-300"
    >
      {{ product.name }}
    </h3>

    <p class="text-dark-400 text-sm line-clamp-2">
      {{ product.description }}
    </p>

    <div class="flex flex-wrap gap-2">
      <span
        *ngFor="let feature of product.features.slice(0, 3)"
        class="text-xs bg-dark-700 text-dark-300 px-2 py-1 rounded"
      >
        {{ feature }}
      </span>
    </div>

    <div class="flex justify-center items-center pt-2">
      <button class="btn-primary !py-2 !px-4 !text-sm w-4/5 mx-auto block">Get Quote</button>
    </div>
  </div>
</div>
