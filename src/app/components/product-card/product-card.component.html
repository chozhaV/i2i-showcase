<div class="bg-white dark:bg-gray-900 text-gray-800 dark:text-white p-6">
  <!-- Title -->
  <h2 class="text-center text-2xl font-bold mb-8">Interactive Flat Panel</h2>

  <!-- Grid layout -->
  <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-6 max-w-6xl mx-auto">
    
    <!-- Left features -->
    <div class="space-y-6 text-center md:text-right">
      <div>
        <img src="/icons/touch.svg" alt="Touch" class="h-10 mx-auto md:ml-auto">
        <p class="mt-2 text-sm">Touch Screen</p>
      </div>
      <div>
        <img src="/icons/users.svg" alt="Multi User" class="h-10 mx-auto md:ml-auto">
        <p class="mt-2 text-sm">Multi-User Support</p>
      </div>
      <div>
        <img src="/icons/wifi.svg" alt="Wireless" class="h-10 mx-auto md:ml-auto">
        <p class="mt-2 text-sm">Wireless Connectivity</p>
      </div>
    </div>

    <!-- Center image -->
    <div class="flex justify-center">
      <img [src]="product.image"
      [alt]="product.name" alt="Flat Panel" class="max-w-full md:max-w-md rounded-lg shadow-md">
    </div>

    <!-- Right features -->
    <div class="space-y-6 text-center md:text-left">
      <div>
        <img src="/icons/4k.svg" alt="4K" class="h-10 mx-auto md:mr-auto">
        <p class="mt-2 text-sm">4K Display</p>
      </div>
      <div>
        <img src="/icons/screencast.svg" alt="Cast" class="h-10 mx-auto md:mr-auto">
        <p class="mt-2 text-sm">Screen Cast</p>
      </div>
      <div>
        <img src="/icons/speaker.svg" alt="Speaker" class="h-10 mx-auto md:mr-auto">
        <p class="mt-2 text-sm">20W x 2 Speakers</p>
      </div>
    </div>
  </div>

  <!-- Get Quote Button -->
  <div class="mt-10 text-center">
    <button class="bg-gradient-to-r from-blue-600 to-purple-600 text-white text-sm font-medium px-8 py-3 rounded-lg shadow-md hover:shadow-lg transition">
      Get Quote
    </button>
  </div>
</div>
